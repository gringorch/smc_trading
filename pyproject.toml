[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-trading"
version = "0.1.0"
description = "Historical 1m market data ingestion for forex and crypto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "typer>=0.15.1",
  "pymysql>=1.1.1",
  "python-binance>=1.0.19",
  "dukascopy-python>=4.0.0",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.1.0",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "bandit>=1.8.2",
  "pip-audit>=2.8.0",
]

[project.scripts]
smc-trading = "main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
