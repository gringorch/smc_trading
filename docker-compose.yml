services:
  db:
    image: mysql:8.0
    container_name: smc_trading_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smc_trading
      MYSQL_USER: smc_user
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "smc_user", "-pchange_me"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smc_trading_app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
